<style>
        body {
            background-color: #000000;
            overflow-x: hidden;
            --mouse-x: 0.5;
            --mouse-y: 0.5;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }

        /* Ambient Glows */
        .ambient-glow {
            position: fixed;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .glow-cyan { 
            background: #63f7ff; 
            top: -200px; 
            left: -200px; 
            transform: translate(calc(var(--mouse-x) * 50px - 25px), calc(var(--mouse-y) * 50px - 25px));
        }
        .glow-violet { 
            background: #dcb8ff; 
            bottom: -200px; 
            right: -200px; 
            transform: translate(calc(var(--mouse-x) * -50px + 25px), calc(var(--mouse-y) * -50px + 25px));
        }

        /* 3D Tilt Container */
        .perspective-container {
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        
        .tilt-card {
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Luminous Stacking Edge (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(99, 247, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(99, 247, 255, 0.1);
        }

        /* Magnetic Button */
        .magnetic-btn {
            background-color: #63f7ff;
            color: #002021;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }
        .magnetic-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }
        .magnetic-btn:hover::after {
            transform: translateX(100%);
        }
        .magnetic-btn:hover {
            box-shadow: 0 0 30px rgba(99, 247, 255, 0.4);
            transform: scale(1.05);
        }

        /* Scroll Hint Animation */
        @keyframes scrollPulse {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(10px); }
        }
        .scroll-hint { animation: scrollPulse 2s infinite ease-in-out; }

        /* Entrance Animations */
        .animate-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
        .delay-500 { animation-delay: 500ms; }

<!-- Motion Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- 1. Mouse Tracking & Tilt Effect ---
            const body = document.body;
            const container = document.querySelector('.perspective-container');
            const card = document.getElementById('main-tilt-card');
            
            window.addEventListener('mousemove', (e) => {
                // Update global mouse variables for CSS (ambient glows)
                const xVal = e.clientX / window.innerWidth;
                const yVal = e.clientY / window.innerHeight;
                body.style.setProperty('--mouse-x', xVal);
                body.style.setProperty('--mouse-y', yVal);
            });

            if(container && card) {
                container.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    
                    // Magnetic pull & tilt
                    const rotateX = ((y - centerY) / centerY) * -15; // Increased tilt
                    const rotateY = ((x - centerX) / centerX) * 15;
                    
                    // Add subtle translation for extra depth
                    const translateX = ((x - centerX) / centerX) * 10;
                    const translateY = ((y - centerY) / centerY) * 10;
                    
                    card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateX(${translateX}px) translateY(${translateY}px)`;
                });
                
                container.addEventListener('mouseleave', () => {
                    card.style.transform = `rotateX(0deg) rotateY(0deg) translateX(0px) translateY(0px)`;
                    card.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
                });
                
                container.addEventListener('mouseenter', () => {
                    card.style.transition = 'transform 0.1s ease-out';
                });
            }

            // --- 2. Canvas Background (Particles & Grid) ---
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = [];
            const moneyParticles = [];
            const PARTICLE_COUNT = 50;
            const MONEY_COUNT = 15; // Subtle money rain

            class Particle {
                constructor() {
                    this.reset(true);
                }
                reset(randomY = false) {
                    this.x = Math.random() * width;
                    this.y = randomY ? Math.random() * height : height + 10;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedY = Math.random() * -1 - 0.5; // Drift up
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;
                    if (this.y < -10) this.reset();
                }
                draw() {
                    ctx.fillStyle = `rgba(99, 247, 255, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class MoneyParticle {
                constructor() {
                    this.reset(true);
                }
                reset(randomY = false) {
                    this.x = Math.random() * width;
                    this.y = randomY ? Math.random() * height : -20;
                    this.size = Math.random() * 10 + 8; // Size of text
                    this.speedY = Math.random() * 1.5 + 0.5; // Fall down
                    this.speedX = Math.sin(this.y * 0.05) * 0.5; // Sway
                    this.rotation = Math.random() * Math.PI * 2;
                    this.rotSpeed = (Math.random() - 0.5) * 0.05;
                    this.opacity = Math.random() * 0.15 + 0.05; // Very subtle
                }
                update() {
                    this.y += this.speedY;
                    this.x += Math.sin(this.y * 0.02) * 0.5;
                    this.rotation += this.rotSpeed;
                    if (this.y > height + 20) this.reset();
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    ctx.fillStyle = `rgba(114, 255, 112, ${this.opacity})`; // Tertiary fixed color
                    ctx.font = `${this.size}px Arial`;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("₹", 0, 0);
                    ctx.restore();
                }
            }

            for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());
            for (let i = 0; i < MONEY_COUNT; i++) moneyParticles.push(new MoneyParticle());

            let time = 0;
            function animate() {
                ctx.clearRect(0, 0, width, height);
                
                // Draw Grid (Kinetic style)
                ctx.strokeStyle = 'rgba(99, 247, 255, 0.03)';
                ctx.lineWidth = 1;
                const gridSize = 60;
                
                // Move grid slightly with mouse
                const mouseOffsetX = parseFloat(body.style.getPropertyValue('--mouse-x') || 0.5) - 0.5;
                const mouseOffsetY = parseFloat(body.style.getPropertyValue('--mouse-y') || 0.5) - 0.5;
                
                const offsetX = (time * 0.5 + mouseOffsetX * 100) % gridSize;
                const offsetY = (time * 0.5 + mouseOffsetY * 100) % gridSize;

                ctx.beginPath();
                for (let x = offsetX - gridSize; x < width; x += gridSize) {
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                }
                for (let y = offsetY - gridSize; y < height; y += gridSize) {
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                }
                ctx.stroke();

                // Draw Particles
                particles.forEach(p => { p.update(); p.draw(); });
                moneyParticles.forEach(p => { p.update(); p.draw(); });

                time++;
                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
